name: Docs Lint

# Lints all Markdown documentation on every push/PR so the docs stay
# consistent as the project grows. Intentionally simulator-free — no
# EDA tool license is available in a public CI runner, so RTL/UVM
# compile checks are run locally / on the design team's infrastructure
# instead. This workflow exists to keep the *documentation* honest.

on:
  push:
    paths:
      - "**/*.md"
  pull_request:
    paths:
      - "**/*.md"

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !**/node_modules/**

      - name: Check for accidental confidential file additions
        run: |
          echo "Scanning for unapproved spec/RTL files..."
          spec_files=$(find docs/00_spec -type f \( -iname "*.pdf" -o -iname "*.docx" \) \
            ! -path "docs/00_spec/BMU_Specification_v1.2.pdf")
          if [ -n "$spec_files" ]; then
            echo "::error::An unapproved specification file was found:"
            printf '%s\n' "$spec_files"
            exit 1
          fi
          rtl_files=$(find rtl -type f \( -iname "*.sv" -o -iname "*.v" -o -iname "*.svh" \) \
            ! -path "rtl/Bit_Manipulation_Unit.sv" \
            ! -path "rtl/rtl_def.sv" \
            ! -path "rtl/rtl_defines.sv" \
            ! -path "rtl/rtl_lib.sv" \
            ! -path "rtl/rtl_param.sv" \
            ! -path "rtl/rtl_pdef.sv")
          if [ -n "$rtl_files" ]; then
            echo "::error::An unapproved RTL source file was found:"
            printf '%s\n' "$rtl_files"
            exit 1
          fi
          echo "OK — no unapproved spec/RTL files detected."
